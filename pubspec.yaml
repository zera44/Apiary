name: apiary
description: "Моя пасіка — план пасіки: вулики, перешкоди, шаблони, параметри та їхня історія. Працює офлайн."
publish_to: 'none'
# Номер після «+» — versionCode Android: лише зростає. До 0.3.5 APK ділились
# за процесором і мали коди 1004/2004/4004, тому єдиний APK починає з 5000+
# (інакше в людей «Програму не встановлено» — пониження версії).
version: 0.3.15+5015

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  # SQLite: sqflite — на Android/iOS; sqflite_common_ffi + sqlite3_flutter_libs —
  # на комп'ютері - лише в тестах (Android-збірка CI їх не вкладає).
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.0
  path_provider: ^2.1.4
  uuid: ^4.4.0
  # підміна часу в тестах (розклад синхронізації, резервних копій)
  clock: ^1.1.1
  # експорт історії в Excel
  excel: ^4.0.6
  # діалог "Зберегти як…" (на Android — системний, без дозволів на сховище)
  file_picker: ^13.0.0
  # відправка змін на сервер (коли його буде налаштовано)
  http: ^1.2.2
  # вхід через Google (див. services/auth.dart)
  google_sign_in: ^7.2.0
  # SHA-256 нічних копій бази (сервер перевіряє, що файл дійшов цілим)
  crypto: ^3.0.7
  # сканер QR-кодів вуликів (камера; лише Android/iOS)
  mobile_scanner: ^7.1.3
  # фото номенклатури на складі (камера або галерея)
  image_picker: ^1.1.2
  # генерація наліпок з QR-кодами вуликів і PDF для друку
  qr: ^3.0.2
  qr_flutter: ^4.1.0
  pdf: ^3.11.3
  # друк наліпок системним вікном друку
  printing: ">=5.14.3 <5.15.0"
  # «Поділитися» звітом Excel (Telegram, пошта…)
  share_plus: ^13.3.0
  # нагадування про обхід вуликів (відкладені системні сповіщення)
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  # розпізнавання чеків (Tesseract, українська: assets/tessdata/ukr.traineddata; Android/iOS)
  flutter_tesseract_ocr: ^0.4.31
  # підготовка фото чека до розпізнавання (сірі тони, адаптивний поріг)
  image: ^4.3.0
  # фото складу у WebP (системний кодувальник Android/iOS; деінде - JPEG)
  flutter_image_compress: ^2.4.0
  # голосовий ввід у текстові поля: Vosk SDK (офлайн; українську модель ~133 МБ
  # застосунок скачує один раз при першому голосовому вводі); лише Android
  vosk_flutter:
    path: packages/vosk_flutter
  workmanager: ^0.10.10
  # чи телефон на мобільному інтернеті (перемикач «Синхронізувати через
  # мобільний інтернет»)
  connectivity_plus: ^7.3.1
  app_links: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # іконки застосунку (див. assets/icons/README.md); кожна підпапка — окремий рядок
    - assets/icons/icons.json
    - assets/icons/objects/
    - assets/icons/obstacles/
    - assets/icons/ui/
    # малюнки для режиму навчання (оригінали — design/guide/*.pdf)
    - assets/guide/
    # мова розпізнавання чеків (tessdata_fast, Apache-2.0) і перелік файлів для плагіна;
    # словник слів (lstm-word-dawg, 3,4 МБ) вилучено: на чеках без нього не гірше
    - assets/tessdata/
    - assets/tessdata_config.json
    # «Що нового» — генерується з історії git (tool/whats_new.py)
    - assets/whats_new.json
