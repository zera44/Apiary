<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d1611">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Адмінка">
<title>Vulyk: адмінка</title>
<style>
  :root { --bg:#1d1611; --card:#2a2018; --line:#4a3a28; --text:#f9efe0; --muted:#bfae94; --honey:#ed9d2f; --dev:#3b5b3a; --user:#3a2f25; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, sans-serif; }
  #main { display:flex; flex-direction:column; height:100vh; height:100dvh; }
  header { position:relative; display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex:none; }
  header h1 { font-size:18px; margin:0; flex:1; min-width:0; }
  header .sp { flex:1; }
  button { background:var(--honey); color:#2b1a08; border:0; border-radius:10px; padding:10px 16px; font:inherit; font-weight:700; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:400; }
  button:disabled { opacity:.5; }
  #login { max-width:380px; margin:12vh auto; padding:0 16px; }
  input, textarea { width:100%; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; }
  textarea { min-height:90px; resize:vertical; }
  .app { display:grid; grid-template-columns: 340px 1fr; flex:1; min-height:0; }
  .list { overflow:auto; border-right:1px solid var(--line); min-height:0; }
  .item { padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover, .item.sel { background:var(--card); }
  .item .top { display:flex; gap:8px; font-size:13px; color:var(--muted); }
  .item .snippet { margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--honey); display:inline-block; }
  .thread { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .msgs { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .m { max-width:78%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .m.user { background:var(--user); align-self:flex-start; border-bottom-left-radius:4px; }
  .m.dev { background:var(--dev); align-self:flex-end; border-bottom-right-radius:4px; }
  .m small { display:block; color:var(--muted); font-size:12px; margin-top:4px; }
  .reply { padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:flex-end; }
  .empty { color:var(--muted); padding:24px; }
  #err { color:#e07a5f; margin-top:10px; min-height:1.4em; }
  #menu-btn { font-size:20px; line-height:1; padding:8px 14px; }
  #menu { position:absolute; z-index:20; top:calc(100% + 4px); left:12px; min-width:250px; max-width:calc(100vw - 24px); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:0 8px 24px rgba(0,0,0,.45); }
  .mi { display:block; width:100%; text-align:left; background:transparent; color:var(--text); border:0; border-radius:8px; padding:12px 14px; font-weight:400; }
  .mi:hover { background:var(--line); }
  .mi.on { background:var(--honey); color:#2b1a08; font-weight:700; }
  #books { padding:16px; flex:1; min-height:0; overflow:auto; width:100%; max-width:920px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:16px; }
  .card h3 { margin:0 0 10px; font-size:16px; }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px; }
  .row.one { grid-template-columns: 1fr; }
  label.f { display:block; color:var(--muted); font-size:13px; margin-bottom:4px; }
  .book { display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
  .book:first-child { border-top:0; }
  .book .meta { flex:1; min-width:0; overflow-wrap:anywhere; }
  .book .sub { color:var(--muted); font-size:13px; }
  .book.off .t { opacity:.5; text-decoration:line-through; }
  .hit { padding:10px 0; border-top:1px solid var(--line); overflow-wrap:anywhere; }
  .hit .src { color:var(--honey); font-size:13px; font-weight:700; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:8px; }
  .bar > div { height:100%; width:0; background:var(--honey); transition:width .2s; }
  #b-queue { margin:4px 0 12px; }
  .q { border-top:1px solid var(--line); padding:10px 0; }
  .q .qn { color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
  .q .qs { display:block; margin-top:2px; }
  .q .qs.ok { color:#8fc98f; } .q .qs.err { color:#e07a5f; }
  .q .qr { display:grid; grid-template-columns:1fr 96px; gap:8px; margin-top:6px; }
  .q input { margin-top:6px; } .q .qr input { margin-top:0; }
  #bstatus { color:var(--muted); margin-top:8px; min-height:1.4em; white-space:pre-wrap; }
  button.danger { background:transparent; color:#e07a5f; border:1px solid #e07a5f; font-weight:400; padding:6px 10px; }
  @media (max-width: 720px) {
    .row { grid-template-columns: 1fr; }
    .app { grid-template-columns: 1fr; }
    .list { border-right:0; }
    .app.open .list { display:none; }
    .app:not(.open) .thread { display:none; }
    /* шапка: назва на всю ширину, нижче вкладки й кнопки; зручні для пальця */
    header { padding:8px 12px; gap:8px; }
    header h1 { font-size:17px; }
    header .ghost, button, .mi { min-height:44px; }
    .item { padding:14px 16px; }
    .m { max-width:90%; }
    .msgs { padding:12px; }
    .reply { padding:10px 12px; flex-direction:column; align-items:stretch; }
    .reply button { width:100%; }
    #books { padding:12px; }
    .card { padding:12px; margin-bottom:12px; }
    /* рядок книги: назва зверху, дії нижче */
    .book { flex-wrap:wrap; }
    .book .meta { flex-basis:100%; }
    .book input[type=checkbox] { width:24px !important; height:24px; }
    #b-go, #b-search { width:100%; }
    .row[style] { grid-template-columns:1fr !important; }
  }
  /* 16px у полях - щоб iPhone не наближав сторінку при введенні */
  @media (pointer: coarse) { input, textarea { font-size:16px; } }
</style>
</head>
<body>
<div id="login">
  <h2>Адмінка Vulyk</h2>
  <p style="color:var(--muted)">Пароль адмінки (секрет FEEDBACK_ADMIN_PASSWORD у Supabase).</p>
  <div style="position:relative">
    <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" style="padding-right:48px">
    <button type="button" id="eye" class="ghost" aria-label="Показати пароль" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:6px 10px">👁</button>
  </div>
  <p><button id="go">Увійти</button></p>
  <details><summary style="color:var(--muted)">Адреса функції</summary>
    <input id="url" style="margin-top:8px">
  </details>
  <div id="err"></div>
</div>
<div id="main" hidden>
  <header>
    <button class="ghost" id="back" hidden aria-label="Назад">←</button>
    <button class="ghost" id="menu-btn" aria-label="Меню" aria-expanded="false" aria-controls="menu">☰</button>
    <h1>Vulyk: адмінка <small id="ver" style="color:var(--muted);font-weight:400;font-size:12px"></small></h1>
    <nav id="menu" hidden>
      <button class="mi on" id="tab-fb">Відгуки</button>
      <button class="mi" id="tab-books">Книги</button>
      <button class="mi" id="refresh">Оновити</button>
      <button class="mi" id="install">Встановити застосунок</button>
      <button class="mi" id="out">Вийти</button>
    </nav>
  </header>
  <div class="app" id="app">
    <div class="list" id="list"></div>
    <div class="thread" id="thread"><div class="empty">Оберіть розмову</div></div>
  </div>
  <div id="books" hidden>
    <div class="card">
      <h3>Додати книгу</h3>
      <div id="b-single">
        <div class="row">
          <div><label class="f" for="b-title">Назва (визначається з файла)</label><input id="b-title"></div>
          <div><label class="f" for="b-author">Автор</label><input id="b-author"></div>
        </div>
      </div>
      <div class="row" id="b-row2">
        <div id="b-yearbox"><label class="f" for="b-year">Рік</label><input id="b-year" inputmode="numeric"></div>
        <div><label class="f" for="b-source">Звідки й на яких правах (для всіх файлів)</label><input id="b-source" placeholder="власний примірник, дозвіл автора…"></div>
      </div>
      <div class="row one">
        <div><label class="f" for="b-file">Файли: PDF (з текстом), TXT або MD. Можна вибрати кілька</label><input id="b-file" type="file" multiple accept=".pdf,.txt,.md,application/pdf,text/plain,text/markdown"></div>
      </div>
      <div id="b-queue" hidden></div>
      <button id="b-go">Завантажити в базу</button>
      <div class="bar"><div id="b-bar"></div></div>
      <div id="bstatus"></div>
    </div>
    <div class="card">
      <h3>Перевірити пошук</h3>
      <div class="row" style="grid-template-columns:1fr auto"><input id="b-q" placeholder="напр.: підгодівля сироп восени"><button id="b-search">Знайти</button></div>
      <div id="b-hits"></div>
    </div>
    <div class="card">
      <h3>Книги в базі</h3>
      <div id="b-list"></div>
    </div>
  </div>
</div>
<script>
const DEFAULT_URL = 'https://zfzkwkudmmpgviueiwwk.supabase.co/functions/v1/feedback';
const DEFAULT_BOOKS_URL = 'https://zfzkwkudmmpgviueiwwk.supabase.co/functions/v1/books';
// pdf.js (читання PDF у браузері) - з cdnjs, версія зафіксована
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const ADMIN_VERSION = '2026-11-08-ai';
// установлення як додатка (на file:// служебний скрипт недоступний - не страшно)
// Самооновлення: перевіряємо новий sw.js при кожному відкритті; коли новий
// скрипт перебрав керування - один раз перезавантажуємо сторінку.
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  const had = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !reloaded) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => r.update()).catch(() => {});
}
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
                del: (k) => { try { localStorage.removeItem(k); } catch {} } };
let url = store.get('fb_url') || DEFAULT_URL, pw = store.get('fb_pw') || '', current = null, timer = null;
$('url').value = url;
$('ver').textContent = 'версія ' + ADMIN_VERSION;

const booksUrl = () => (/\/feedback\/?$/.test(url) ? url.replace(/\/feedback\/?$/, '/books') : DEFAULT_BOOKS_URL);
async function api(body, endpoint) {
  const r = await fetch(endpoint || url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-feedback-admin': pw }, body: JSON.stringify(body) });
  if (r.status === 401) { logout('Невірний пароль'); throw new Error('401'); }
  if (!r.ok) throw new Error('Помилка ' + r.status);
  return r.json();
}
function fmt(iso) { return new Date(iso).toLocaleString('uk-UA', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

async function loadList() {
  const { threads } = await api({ action: 'admin_list' });
  const list = $('list'); list.replaceChildren();
  if (!threads.length) list.append(el('div', 'empty', 'Відгуків ще немає'));
  for (const t of threads) {
    const it = el('div', 'item' + (t.id === current ? ' sel' : ''));
    const top = el('div', 'top');
    if (t.unread) top.append(el('span', 'dot'));
    top.append(el('span', '', fmt(t.last_at)), el('span', '', t.platform || ''));
    it.append(top, el('div', 'snippet', (t.last && t.last.from_dev ? 'Ви: ' : '') + (t.last ? t.last.body : '')));
    it.onclick = () => openThread(t.id);
    list.append(it);
  }
}
async function openThread(id) {
  current = id; $('app').classList.add('open'); $('back').hidden = false;
  const { messages } = await api({ action: 'admin_thread', thread_id: id });
  const th = $('thread'); th.replaceChildren();
  const box = el('div', 'msgs');
  for (const m of messages) { const d = el('div', 'm ' + (m.from_dev ? 'dev' : 'user'), m.body); d.append(el('small', '', fmt(m.at))); box.append(d); }
  const ta = el('textarea'); ta.placeholder = 'Відповідь…';
  const send = el('button', '', 'Надіслати');
  send.onclick = async () => {
    const body = ta.value.trim(); if (!body) return;
    send.disabled = true;
    try { await api({ action: 'admin_reply', thread_id: id, body }); await openThread(id); await loadList(); } catch (e) { send.disabled = false; alert(e.message); }
  };
  const reply = el('div', 'reply'); reply.append(ta, send);
  th.append(box, reply); box.scrollTop = box.scrollHeight;
  loadList();
}
function logout(msg) { setMenu(false); store.del('fb_pw'); pw = ''; clearInterval(timer); $('main').hidden = true; $('login').hidden = false; $('err').textContent = msg || ''; }
async function enter() {
  pw = $('pw').value || pw; url = $('url').value.trim() || DEFAULT_URL;
  $('err').textContent = '';
  try { await loadList(); } catch (e) { if (e.message !== '401') $('err').textContent = e.message; return; }
  store.set('fb_pw', pw); store.set('fb_url', url);
  $('login').hidden = true; $('main').hidden = false;
  timer = setInterval(() => loadList().catch(() => {}), 30000);
}
$('eye').onclick = () => { const i = $('pw'); i.type = i.type === 'password' ? 'text' : 'password'; };
$('go').onclick = enter; $('pw').onkeydown = (e) => { if (e.key === 'Enter') enter(); };
$('refresh').onclick = () => { if (!$('books').hidden) { loadBooks(); return; } loadList(); if (current) openThread(current); };
$('out').onclick = () => logout();

// ---------------------------------------------------------------- меню (три риски)
const menu = $('menu'), menuBtn = $('menu-btn');
const setMenu = (open) => { menu.hidden = !open; menuBtn.setAttribute('aria-expanded', String(open)); };
menuBtn.onclick = (e) => { e.stopPropagation(); setMenu(menu.hidden); };
menu.onclick = () => setMenu(false); // будь-який пункт закриває меню (його дія спрацьовує раніше)
document.addEventListener('click', (e) => { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });

// «Встановити застосунок»: Chrome сам пропонує установлення подією; якщо її немає - підказка
let installEvt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; });
window.addEventListener('appinstalled', () => { installEvt = null; $('install').hidden = true; });
if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) $('install').hidden = true;
$('install').onclick = async () => {
  if (installEvt) { installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; return; }
  alert(/iphone|ipad|ipod/i.test(navigator.userAgent)
    ? 'У Safari: «Поділитися» → «На екран «Додому»».'
    : 'У Chrome: меню ⋮ → «Установити застосунок» (або «Додати на головний екран»).\nПотрібен Chrome і сторінка за адресою https (GitHub Pages), не відкрита з файлу.');
};
$('back').onclick = () => { $('app').classList.remove('open'); $('back').hidden = true; current = null; };

// ---------------------------------------------------------------- книги
function showTab(books) {
  $('books').hidden = !books; $('app').hidden = books;
  $('tab-books').classList.toggle('on', books); $('tab-fb').classList.toggle('on', !books);
  if (books) { $('back').hidden = true; loadBooks().catch((e) => { $('bstatus').textContent = e.message; }); }
  else if (current) $('back').hidden = false;
}
$('tab-fb').onclick = () => showTab(false);
$('tab-books').onclick = () => showTab(true);
const bapi = (body) => api(body, booksUrl());
const bsay = (t) => { $('bstatus').textContent = t; };
const progress = (x) => { $('b-bar').style.width = Math.round(Math.max(0, Math.min(1, x)) * 100) + '%'; };

let knownTitles = new Set();
async function loadBooks() {
  const { books } = await bapi({ action: 'list' });
  knownTitles = new Set(books.map((b) => b.title.trim().toLowerCase()));
  const box = $('b-list'); box.replaceChildren();
  if (!books.length) box.append(el('div', 'empty', 'Книг ще немає. Додайте першу вище.'));
  for (const b of books) {
    const row = el('div', 'book' + (b.enabled ? '' : ' off'));
    const meta = el('div', 'meta');
    meta.append(el('div', 't', b.title));
    meta.append(el('div', 'sub', [b.author, b.year, b.pages ? b.pages + ' с.' : '', b.chunks + ' уривків', b.source].filter(Boolean).join(' · ')));
    const on = el('input'); on.type = 'checkbox'; on.checked = b.enabled; on.title = 'Помічник користується цією книгою';
    on.style.width = 'auto';
    on.onchange = async () => { try { await bapi({ action: 'set_enabled', book_id: b.id, enabled: on.checked }); await loadBooks(); } catch (e) { alert(e.message); } };
    const del = el('button', 'danger', 'Видалити');
    del.onclick = async () => {
      if (!confirm('Видалити «' + b.title + '» разом з усіма уривками?')) return;
      try { await bapi({ action: 'delete', book_id: b.id }); await loadBooks(); } catch (e) { alert(e.message); }
    };
    row.append(meta, el('label', 'sub', 'увімкнена'), on, del);
    box.append(row);
  }
}

// -- текст з файлу

/** UTF-8, а якщо не вийшло (старі файли) - windows-1251. */
async function readText(file) {
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch { return new TextDecoder('windows-1251').decode(buf); }
}

async function loadPdfJs() {
  if (window.pdfjsLib) return;
  await new Promise((ok, bad) => {
    const s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js';
    s.onload = ok; s.onerror = () => bad(new Error('Не вдалося завантажити pdf.js (потрібен інтернет)'));
    document.head.append(s);
  });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
}

/** Сторінки PDF: [{page, text}]; text - рядки склеєно в абзац. */
async function readPdf(file, onPage) {
  await loadPdfJs();
  const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const tc = await (await pdf.getPage(i)).getTextContent();
    let line = '', lastY = null; const lines = [];
    for (const it of tc.items) {
      const y = it.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 2) { lines.push(line); line = ''; }
      line += it.str; lastY = y;
    }
    lines.push(line);
    pages.push({ page: i, text: lines.join(' ').replace(/-\s+(?=\p{Ll})/gu, '').replace(/\s+/g, ' ').trim() });
    onPage(i, pdf.numPages);
  }
  return pages;
}

const MAXC = 1200, MINC = 40;

/** Уривки ~1200 знаків: за абзацами, довгі - за реченнями. page = null, якщо сторінок немає. */
function chunkPages(pages) {
  const out = [];
  for (const p of pages) {
    const parts = p.text.split(/\n{2,}/).map((x) => x.replace(/\s+/g, ' ').trim()).filter(Boolean);
    const pieces = [];
    for (const part of parts) {
      if (part.length <= MAXC) { pieces.push(part); continue; }
      for (const s of part.split(/(?<=[.!?…])\s+/u)) {
        if (s.length <= MAXC) pieces.push(s);
        else for (let i = 0; i < s.length; i += MAXC) pieces.push(s.slice(i, i + MAXC));
      }
    }
    let cur = '';
    const flush = () => { if (cur.length >= MINC) out.push({ page: p.page, text: cur }); else if (cur && out.length && out[out.length - 1].page === p.page) out[out.length - 1].text += ' ' + cur; cur = ''; };
    for (const piece of pieces) {
      if (cur && (cur + ' ' + piece).length > MAXC) flush();
      cur = cur ? cur + ' ' + piece : piece;
    }
    flush();
  }
  return out;
}

// -- автовизначення назви, автора й року з перших сторінок

const YEAR_NOW = new Date().getFullYear();
const CAP = '[А-ЯІЇЄҐA-Z]', LOW = "[а-яіїєґ'’a-z\\-]";
// «Прізвище Ім'я (По батькові)», «І. І. Прізвище», «Прізвище І. І.»
const NAME_RE = new RegExp('^(?:' + CAP + LOW + '+(?:\\s+' + CAP + LOW + '+){1,2}|' + CAP + '\\.\\s?(?:' + CAP + '\\.\\s?)?' + CAP + LOW + '+|' + CAP + LOW + '+\\s+' + CAP + '\\.\\s?(?:' + CAP + '\\.)?)$');
const LABEL_RE = /^(назва|title|автор(?:и)?|author(?:s)?|упорядник(?:и)?|укладач(?:і)?|by|рік|year)\s*[:\-–—]\s*(.+)$/i;
const BAD_TITLE = /^(untitled|microsoft word|без назви|document\d*|new document)|\.(docx?|pdf|indd|tex|txt|md)$|_|^[^\p{L}]*$/iu;

/** Рік видання: найкращий збіг із позначкою «©», «видання», «Київ, 1985» тощо. */
function findYear(lines) {
  const kw = /©|\(c\)|copyright|видан|видав|вид-во|вид\.|publish|edition|press|(?<!\p{L})р\.|року|рік(?!\p{L})|київ|львів|харків|одеса|москва|ленінград|ужгород/iu;
  let best = null;
  lines.forEach((t, i) => {
    for (const m of t.matchAll(/(?<!\d)(1[5-9]\d\d|20[0-3]\d)(?!\d)/g)) {
      const y = +m[1]; if (y > YEAR_NOW) continue;
      const score = (kw.test(t) ? 3 : 0) + (t.length < 80 ? 1 : 0);
      if (!best || score > best.score || (score === best.score && i >= best.i)) best = { y, score, i };
    }
  });
  return best && best.score >= 1 ? best.y : null;
}

/** pages: [[{text, size}]] (рядки перших сторінок), meta: {title, author} з метаданих файла. */
function guessBook({ pages, meta }) {
  const out = { title: '', author: '', year: null };
  const all = pages.flat().map((l) => l.text);
  // 1) підписані рядки: «Назва: …», «Автор: …», «Рік: …»
  for (const t of all.slice(0, 80)) {
    const m = LABEL_RE.exec(t); if (!m) continue;
    const k = m[1].toLowerCase(), v = m[2].trim();
    if (/^(назва|title)$/.test(k) && !out.title) out.title = v;
    else if (/^(рік|year)$/.test(k)) { const y = +(/\d{4}/.exec(v) || [])[0]; if (y >= 1500 && y <= YEAR_NOW && !out.year) out.year = y; }
    else if (!out.author) out.author = v;
  }
  // 2) метадані PDF (якщо схожі на справжні, а не на ім'я файла)
  const mt = (meta.title || '').trim(), ma = (meta.author || '').trim();
  if (!out.title && mt.length >= 4 && !BAD_TITLE.test(mt)) out.title = mt;
  if (!out.author && ma.length >= 3 && /[A-Za-zА-Яа-яІіЇїЄє]/.test(ma) && !/^(admin|user|owner|unknown)$/i.test(ma)) out.author = ma;
  // 3) перша сторінка з текстом: назва - найбільший шрифт, автор - ім'я під нею
  const first = pages.find((p) => p.length) || [];
  let titleEnd = -1;
  if (!out.title && first.length) {
    const cand = first.filter((l) => l.text.length >= 3 && /\p{L}/u.test(l.text));
    const max = Math.max(...cand.map((l) => l.size), 0);
    const uniform = cand.every((l) => Math.abs(l.size - max) < 0.5);
    let i = uniform ? first.indexOf(cand[0]) : first.indexOf(cand.find((l) => l.size >= max * 0.92));
    const parts = [];
    for (; i >= 0 && i < first.length; i++) {
      const l = first[i];
      if (!uniform && l.size < max * 0.92) break;
      parts.push(l.text); titleEnd = i;
      if (uniform || parts.join(' ').length > 160) break;
    }
    out.title = parts.join(' ').replace(/^#+\s*|\*\*/g, '').trim();
  }
  if (!out.author && first.length) {
    for (const l of first.slice(titleEnd + 1, titleEnd + 9)) {
      const t0 = l.text.trim().replace(/[,;]+$/, ''), t1 = t0.replace(/\.$/, '');
      const t = NAME_RE.test(t0) ? t0 : NAME_RE.test(t1) ? t1 : '';
      if (t && t !== out.title) { out.author = t; break; }
    }
  }
  if (!out.year) out.year = findYear(all.slice(0, 160));
  out.title = out.title.slice(0, 280); out.author = out.author.slice(0, 200);
  return out;
}

/** Рядки з розмірами шрифту перших сторінок PDF + метадані. */
async function readPdfHead(file, maxPages = 5, onPage = () => {}) {
  await loadPdfJs();
  const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  let meta = {};
  try { const i = (await pdf.getMetadata()).info || {}; meta = { title: i.Title || '', author: i.Author || '' }; } catch {}
  const pages = [];
  for (let n = 1; n <= Math.min(maxPages, pdf.numPages); n++) {
    const tc = await (await pdf.getPage(n)).getTextContent();
    const lines = []; let cur = null, lastY = null;
    for (const it of tc.items) {
      const y = it.transform[5], size = Math.abs(it.transform[3]) || it.height || 0;
      if (cur && lastY !== null && Math.abs(y - lastY) <= 2) { cur.text += it.str; cur.size = Math.max(cur.size, size); }
      else { if (cur) lines.push(cur); cur = { text: it.str, size }; }
      if (it.str.trim()) lastY = y;
    }
    if (cur) lines.push(cur);
    pages.push(lines.map((l) => ({ text: l.text.replace(/\s+/g, ' ').trim(), size: l.size })).filter((l) => l.text));
    onPage(n, Math.min(maxPages, pdf.numPages));
  }
  return { pages, meta };
}

/** TXT / MD: рядки без розмірів; «---» заголовок MD ігноруємо. full - увесь файл, інакше лише початок. */
async function readTextHead(file, full = false) {
  const raw = (await readText(file)).replace(/\r\n?/g, '\n');
  const lines = (full ? raw : raw.slice(0, 6000)).split('\n').map((t) => t.replace(/^#+\s*/, '').trim()).filter((t) => t && !/^-{3,}$/.test(t)).map((t) => ({ text: t, size: 1 }));
  return { pages: [full ? lines : lines.slice(0, 60)], meta: {} };
}

/** Увесь файл: рядки всіх сторінок PDF (або всі рядки TXT/MD) + метадані. */
const readBookFull = (file, onPage) => (/\.pdf$/i.test(file.name) ? readPdfHead(file, Infinity, onPage) : readTextHead(file, true));

// -- стислий витяг з усієї книги для ШІ: початок, колонтитули, зміст, вихідні дані, кінець
const IMPRINT_RE = /©|\(c\)|copyright|isbn|удк|ббк|видавництв|видав|автор|укладач|упорядник|редактор|переклад|рецензент|author|published|publisher|translated/iu;
const TOC_RE = /^\s*(зміст|содержание|оглавлення|contents|table of contents)\s*$/iu;

function buildDigest({ pages, meta }) {
  const txt = (lines) => lines.map((l) => l.text).join('\n');
  const cap = (t, n) => (t.length > n ? t.slice(0, n) + '…' : t);
  const total = pages.length, out = [];
  out.push('Сторінок у файлі: ' + total);
  if (meta.title || meta.author) out.push('Метадані файла: назва «' + (meta.title || '') + '», автор «' + (meta.author || '') + '»');
  out.push('--- ПОЧАТОК (перші сторінки) ---');
  pages.slice(0, 3).forEach((p, i) => out.push('[с.' + (i + 1) + ']\n' + cap(txt(p), 1800)));
  if (total >= 6) { // рядки, що повторюються на багатьох сторінках, - колонтитули
    const norm = (t) => t.toLowerCase().replace(/\d+/g, '#').replace(/\s+/g, ' ').trim();
    const cnt = new Map();
    for (const p of pages) {
      const seen = new Set();
      for (const l of p) {
        const k = norm(l.text);
        if (k.length < 4 || k.length > 120 || !/\p{L}/u.test(k) || seen.has(k)) continue;
        seen.add(k);
        const e = cnt.get(k) || { n: 0, sample: l.text }; e.n++; cnt.set(k, e);
      }
    }
    const rep = [...cnt.values()].filter((e) => e.n >= Math.max(3, total * 0.2)).sort((a, b) => b.n - a.n).slice(0, 12);
    if (rep.length) out.push('--- РЯДКИ, ЩО ПОВТОРЮЮТЬСЯ НА СТОРІНКАХ (колонтитули) ---\n' + rep.map((e) => e.sample + '  (на ' + e.n + ' стор.)').join('\n'));
  }
  for (let i = 0; i < Math.min(30, total); i++) { // зміст
    if (pages[i].some((l) => TOC_RE.test(l.text))) { out.push('--- ЗМІСТ (с.' + (i + 1) + ') ---\n' + cap(txt(pages[i]) + '\n' + txt(pages[i + 1] || []), 2500)); break; }
  }
  const imprint = [], seenI = new Set(); // вихідні дані по всій книзі
  pages.forEach((p, i) => { for (const l of p) {
    if (imprint.length >= 40 || l.text.length < 6 || l.text.length > 220 || seenI.has(l.text) || !IMPRINT_RE.test(l.text)) continue;
    seenI.add(l.text); imprint.push('[с.' + (i + 1) + '] ' + l.text);
  } });
  if (imprint.length) out.push('--- РЯДКИ З ВИХІДНИМИ ДАНИМИ (по всій книзі) ---\n' + imprint.join('\n'));
  if (total > 5) {
    out.push('--- КІНЕЦЬ (останні сторінки) ---');
    pages.slice(-2).forEach((p, i, a) => out.push('[с.' + (total - a.length + i + 1) + ']\n' + cap(txt(p), 1200)));
  }
  return out.join('\n\n').slice(0, 30000);
}

/** Назва, автор, рік з усієї книги: ШІ за витягом; ШІ недоступний - евристика за початком. */
async function identifyBook(file, say) {
  const book = await readBookFull(file, (i, n) => say('Читаю файл повністю: сторінка ' + i + ' з ' + n + '…'));
  say('Файл прочитано. ШІ визначає назву, автора й рік…');
  try {
    const r = await bapi({ action: 'identify', digest: buildDigest(book), filename: file.name });
    return { title: r.title || '', author: r.author || '', year: r.year == null ? null : r.year, via: 'ai' };
  } catch (e) {
    return { ...guessBook({ pages: book.pages.slice(0, 5), meta: book.meta }), via: 'heuristic', why: e.message };
  }
}

const autoFields = { 'b-title': 'title', 'b-author': 'author', 'b-year': 'year' };
for (const id of Object.keys(autoFields)) $(id).addEventListener('input', () => { delete $(id).dataset.auto; });

const fileNameTitle = (f) => f.name.replace(/\.[^.]+$/, '').replace(/_+/g, ' ').trim();
const yearOf = (v) => { const y = parseInt(v, 10); return Number.isFinite(y) ? y : null; };

// ---- черга файлів (пакетне завантаження)
let queue = [], uploading = false, detectRun = 0;
const isMulti = () => queue.length > 1;
const QSTATE = { wait: '', busy: '⏳ ', done: '✓ ', err: '✗ ', skip: '– ' };

function updateRow(q) {
  if (!q.ui) return;
  q.ui.note.textContent = (QSTATE[q.state] || '') + (q.note || '');
  q.ui.note.className = 'qs' + (q.state === 'done' ? ' ok' : q.state === 'err' ? ' err' : '');
  for (const i of q.ui.inputs) i.disabled = uploading || q.state === 'done';
}
function renderQueue() {
  const box = $('b-queue'); box.replaceChildren(); box.hidden = !isMulti();
  $('b-single').hidden = isMulti(); $('b-yearbox').hidden = isMulti(); $('b-row2').classList.toggle('one', isMulti());
  if (!isMulti()) return;
  for (const q of queue) {
    const row = el('div', 'q'), head = el('div', 'qn'), note = el('span', 'qs');
    head.append(el('span', '', q.file.name), note);
    const t = el('input'), au = el('input'), yr = el('input'), line = el('div', 'qr');
    t.placeholder = 'Назва'; au.placeholder = 'Автор'; yr.placeholder = 'Рік'; yr.inputMode = 'numeric';
    t.value = q.title; au.value = q.author; yr.value = q.year;
    t.oninput = () => { q.title = t.value; }; au.oninput = () => { q.author = au.value; }; yr.oninput = () => { q.year = yr.value; };
    line.append(au, yr); row.append(head, t, line); box.append(row);
    q.ui = { note, inputs: [t, au, yr], t, au, yr };
    updateRow(q);
  }
}

$('b-file').onchange = async () => {
  const files = [...$('b-file').files], run = ++detectRun;
  queue = files.length > 1 ? files.map((file) => ({ file, title: '', author: '', year: '', state: 'wait', note: 'читаю початок…' })) : [];
  renderQueue();
  if (!files.length) return;
  if (files.length === 1) {
    const file = files[0];
    bsay('Читаю файл повністю: назва, автор, рік…');
    try {
      const g = await identifyBook(file, bsay), got = [];
      for (const [id, key] of Object.entries(autoFields)) {
        const el_ = $(id), v = g[key] == null ? '' : String(g[key]);
        // не затираємо те, що вписала людина; раніше автозаповнене - оновлюємо
        if (v && (!el_.value.trim() || el_.dataset.auto)) { el_.value = v; el_.dataset.auto = '1'; got.push(key); }
      }
      const what = got.map((k) => ({ title: 'назва', author: 'автор', year: 'рік' }[k])).join(', ');
      bsay((g.via === 'ai' ? 'ШІ прочитав усю книгу й визначив: ' : 'ШІ недоступний (' + g.why + '), за початком файла визначено: ') + (what || 'нічого') +
           '. Перевірте й за потреби виправте.');
    } catch (e) { bsay('Не вдалося прочитати файл: ' + e.message); }
    return;
  }
  bsay('Файлів: ' + files.length + '. Читаю кожен повністю й визначаю дані…');
  let viaAi = 0;
  for (const q of queue) {
    if (run !== detectRun) return; // вибрали інші файли
    try {
      const g = await identifyBook(q.file, (t) => { if (run === detectRun) { q.note = t; updateRow(q); } });
      q.title = g.title || fileNameTitle(q.file); q.author = g.author || ''; q.year = g.year == null ? '' : String(g.year);
      q.note = g.via === 'ai' ? '' : 'без ШІ: за початком файла - перевірте'; if (g.via === 'ai') viaAi++;
    } catch (e) { q.title = fileNameTitle(q.file); q.note = 'файл не прочитався - перевірте дані'; }
    if (run !== detectRun) return;
    q.ui.t.value = q.title; q.ui.au.value = q.author; q.ui.yr.value = q.year; updateRow(q);
  }
  bsay('Дані визначено для ' + queue.length + ' файлів' + (viaAi === queue.length ? ' (ШІ прочитав кожну книгу повністю)' : ' (ШІ: ' + viaAi + ' з ' + queue.length + ')') + '. Перевірте й натисніть «Завантажити в базу».');
};

/** Завантажує одну книгу: читає файл, ділить на уривки, шле на сервер. Повертає кількість уривків. */
async function uploadBook(file, { title, author, year, source }, say, prog) {
  say('Читаю файл…');
  let pages;
  if (/\.pdf$/i.test(file.name)) {
    pages = await readPdf(file, (i, n) => { say('Читаю сторінку ' + i + ' з ' + n + '…'); prog(i / n * 0.4); });
    const chars = pages.reduce((s, p) => s + p.text.length, 0);
    if (chars < pages.length * 40) throw new Error('У PDF майже немає тексту - схоже, це скан. Потрібен PDF з текстовим шаром (або спершу розпізнайте його).');
  } else {
    pages = [{ page: null, text: (await readText(file)).replace(/\r\n?/g, '\n') }];
  }
  const chunks = chunkPages(pages);
  if (!chunks.length) throw new Error('Не знайшов тексту для уривків.');
  say('Створюю книгу…');
  const { id } = await bapi({ action: 'add_book', title, author, year, source });
  try {
    const BATCH = 40;
    for (let i = 0; i < chunks.length; i += BATCH) {
      await bapi({ action: 'add_chunks', book_id: id, start: i, chunks: chunks.slice(i, i + BATCH) });
      say('Завантажено уривків: ' + Math.min(i + BATCH, chunks.length) + ' з ' + chunks.length);
      prog(0.4 + 0.6 * Math.min(i + BATCH, chunks.length) / chunks.length);
    }
    await bapi({ action: 'finish', book_id: id, pages: pages.filter((p) => p.page).length, chunks: chunks.length });
  } catch (e) {
    await bapi({ action: 'delete', book_id: id }).catch(() => {}); // недозавантажену книгу не лишаємо
    throw e;
  }
  return chunks.length;
}

$('b-go').onclick = async () => {
  const files = [...$('b-file').files];
  if (!files.length) { bsay('Потрібен файл.'); return; }
  const source = $('b-source').value.trim();
  $('b-go').disabled = true; uploading = true; progress(0); queue.forEach(updateRow);
  try {
    if (files.length === 1) {
      const file = files[0], title = $('b-title').value.trim() || fileNameTitle(file);
      if (knownTitles.has(title.toLowerCase()) && !confirm('Книга «' + title + '» уже є в базі. Додати ще раз?')) { bsay('Скасовано.'); return; }
      const n = await uploadBook(file, { title, author: $('b-author').value.trim(), year: yearOf($('b-year').value), source }, bsay, progress);
      bsay('Готово: ' + n + ' уривків.'); progress(1);
      for (const f of ['b-title', 'b-author', 'b-year', 'b-source', 'b-file']) $(f).value = '';
      await loadBooks();
    } else {
      const todo = queue.filter((q) => q.state !== 'done');
      let ok = 0, fail = 0, skip = 0;
      for (const [k, q] of todo.entries()) {
        q.state = 'busy'; q.note = ''; updateRow(q);
        const title = q.title.trim() || fileNameTitle(q.file);
        bsay('Файл ' + (k + 1) + ' з ' + todo.length + ': ' + q.file.name);
        if (knownTitles.has(title.toLowerCase())) { q.state = 'skip'; q.note = 'уже є в базі - пропущено'; skip++; updateRow(q); continue; }
        try {
          const n = await uploadBook(q.file, { title, author: q.author.trim(), year: yearOf(q.year), source },
            (t) => { q.note = t; updateRow(q); }, (x) => progress((k + x) / todo.length));
          q.state = 'done'; q.note = n + ' уривків'; knownTitles.add(title.toLowerCase()); ok++;
        } catch (e) { q.state = 'err'; q.note = e.message; fail++; }
        updateRow(q);
      }
      progress(1);
      bsay('Готово: завантажено ' + ok + (skip ? ', пропущено ' + skip : '') + (fail ? ', з помилкою ' + fail + ' (виправте й натисніть ще раз: уже завантажені не повторюються)' : '') + '.');
      await loadBooks();
    }
  } catch (e) { bsay('Не вийшло: ' + e.message); progress(0); }
  finally { $('b-go').disabled = false; uploading = false; queue.forEach(updateRow); }
};

$('b-search').onclick = async () => {
  const q = $('b-q').value.trim(); if (!q) return;
  const box = $('b-hits'); box.replaceChildren();
  try {
    const { results } = await bapi({ action: 'search', query: q });
    if (!results.length) box.append(el('div', 'empty', 'Нічого не знайдено (так само відповість і помічник).'));
    for (const r of results) {
      const h = el('div', 'hit');
      h.append(el('div', 'src', [r.title, r.author, r.page ? 'с. ' + r.page : ''].filter(Boolean).join(', ')));
      h.append(el('div', '', r.body.length > 500 ? r.body.slice(0, 500) + '…' : r.body));
      box.append(h);
    }
  } catch (e) { box.append(el('div', 'empty', e.message)); }
};
$('b-q').onkeydown = (e) => { if (e.key === 'Enter') $('b-search').click(); };

if (pw) enter();
