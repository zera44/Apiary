name: Supabase keep-alive

# Безкоштовний проєкт Supabase призупиняється після тижня без запитів.
# Раз на 3 дні викликаємо public.ping() в обох проєктах (тестовому й
# робочому) - це справжній запис у базу. Проєкт без секретів пропускається.
# Розклад GitHub виконує лише з гілки за замовчуванням (main).
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        project: [ TEST, PROD ]
    steps:
      - name: Пінг ${{ matrix.project }}
        env:
          URL: ${{ matrix.project == 'PROD' && secrets.SUPABASE_URL_PROD || secrets.SUPABASE_URL_TEST }}
          KEY: ${{ matrix.project == 'PROD' && secrets.SUPABASE_ANON_KEY_PROD || secrets.SUPABASE_ANON_KEY_TEST }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::notice::Секретів для ${{ matrix.project }} немає - пропускаю"
            exit 0
          fi
          for i in 1 2 3; do
            if curl -fsS --max-time 30 -X POST "${URL%/}/rest/v1/rpc/ping" \
                 -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'; then
              echo; echo "Проєкт ${{ matrix.project }} живий"
              exit 0
            fi
            sleep $((i * 20))
          done
          echo "::error::Проєкт ${{ matrix.project }} не відповідає (призупинено? відновіть у панелі Supabase)"
          exit 1
