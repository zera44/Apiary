name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      tests_only:
        description: 'Лише аналіз і тести, без збірки APK (економія хвилин)'
        type: boolean
        default: false

# за замовчуванням токен CI — лише на читання; запис має тільки публікація
permissions:
  contents: read

jobs:
  test:
    name: Перевірка й тести
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # уся історія — з неї збирається «Що нового»
      - name: «Що нового» з історії комітів
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python3 tool/whats_new.py 2>/dev/null || python tool/whats_new.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: SQLite для тестів
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Версія Flutter
        shell: bash
        run: echo "::notice title=FLUTTER::$(flutter --version --machine | tr -d '\n')"
      - name: Залежності
        shell: bash
        run: |
          set -o pipefail
          # точно ті версії й вміст пакетів, що в pubspec.lock (без тихих оновлень)
          flutter pub get --enforce-lockfile 2>&1 | tee build.log
      # падає на помилках і попередженнях (підказки стилю — не критичні)
      - name: Аналіз коду
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee build.log
      - name: Тести
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee build.log
      # посередник помічника «Пасічник» (фейкова модель, без Supabase)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Тести посередника помічника
        shell: bash
        run: |
          set -o pipefail
          node --test supabase/tests/assistant*.test.ts 2>&1 | tee build.log
      - name: Показати помилку
        if: failure()
        run: python3 tool/ci_error_report.py build.log
      # назви ВСІХ тестів, що впали (у звіті вище вміщується лише кілька)
      - name: Які тести впали
        if: failure()
        shell: bash
        run: |
          grep -E '^::group::❌' build.log | sed -E 's/^::group::❌ [^:]*: //; s/ \(failed\)$//' \
            | sort -u | head -20 | while IFS= read -r l; do echo "::error title=TEST::$l"; done || true
      - name: Бенчмарк швидкості
        shell: bash
        run: |
          flutter test test_bench/bench_test.dart 2>&1 | tee bench.log || true
          grep -h '^BENCH|' bench.log | sed 's/^BENCH|//' > bench.txt || true
          echo "::notice title=BENCH::$(sed ':a;N;$!ba;s/\n/%0A/g' bench.txt)"

  android:
    name: APK для Android
    needs: test
    if: ${{ !inputs.tests_only }}
    runs-on: ubuntu-latest
    # запис - для тестового пре-релізу гілки і релізу з main (кроки нижче)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # уся історія — з неї збирається «Що нового»
      - name: «Що нового» з історії комітів
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python3 tool/whats_new.py 2>/dev/null || python tool/whats_new.py
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      # Спершу — точно ті версії й вміст пакетів, що в pubspec.lock (до
      # будь-яких інших кроків, які могли б тихо переписати файл версій).
      - name: Залежності
        run: flutter pub get --enforce-lockfile
      # Плагін розпізнавання тексту має застарілий build.gradle (jcenter, AGP 7.1):
      # з сучасним Gradle не збирається. Підміняємо на мінімальний сучасний.
      - name: Полагодити gradle плагіна розпізнавання
        shell: bash
        run: |
          d=$(ls -d "$HOME"/.pub-cache/hosted/pub.dev/flutter_tesseract_ocr-*/ | head -1)
          cat > "${d}android/build.gradle" <<'EOF2'
          group 'io.paratoner.flutter_tesseract_ocr'
          version '1.0'

          rootProject.allprojects {
              repositories {
                  flatDir {
                      dirs project(':flutter_tesseract_ocr').file('libs')
                  }
              }
          }

          apply plugin: 'com.android.library'

          android {
              namespace "io.paratoner.flutter_tesseract_ocr"
              compileSdk 34
              defaultConfig {
                  minSdk 21
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              api(name: 'tesseract4android-release', ext: 'aar')
          }
          EOF2
          echo "::notice title=GRADLE::патч застосовано до $d"
          # зразкове фото з пакета (37 КБ) застосунку не потрібне - лишаємо 1x1
          if [ -f "${d}images/test_11.jpg" ]; then
            echo '' | base64 -d > "${d}images/test_11.jpg"
          fi
      - name: Згенерувати платформні файли
        env:
          APIARY_SIGNING: '1'
        run: |
          flutter create --no-pub --platforms=android --org org.apiary --project-name apiary .
          dart run tool/patch_platforms.dart
          # Пам'ять Gradle: типові 8 ГБ + 4 ГБ метаданих разом із демоном Kotlin
          # і збіркою нативних бібліотек (Vosk, Tesseract) вичерпували 16 ГБ
          # раннера - GitHub вбивав машину посеред збірки (exit 143)
          sed -i '/^org.gradle.jvmargs=/d' android/gradle.properties
          cat >> android/gradle.properties <<'EOF2'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.jvmargs=-Xmx1536m
          org.gradle.workers.max=2
          EOF2
      # Власна копія SQLite потрібна лише на комп'ютері: на Android працює
      # sqflite із системною SQLite, а додатковий libsqlite3.so важить
      # ~0,8 МБ на кожну архітектуру. Її вкладають ДВА джерела: плагін
      # sqlite3_flutter_libs і build-hook пакета sqlite3 — вимикаємо обидва.
      - name: Не вкладати власну SQLite в Android-збірку
        run: |
          flutter pub remove sqlite3_flutter_libs
          cat >> pubspec.yaml <<'EOF2'

          hooks:
            user_defines:
              sqlite3:
                source: system
          EOF2
      # Один APK для всіх телефонів: ARM 32 і 64 біти. x86_64 не вкладаємо
      # (−8 МБ): телефонів на x86 практично немає, а Chromebook запускає ARM.
      # Ключ підпису — із секретів репозиторію, і ЛИШЕ для push у main
      # (гілки, pull request'и й ручні запуски підписуються тимчасовим
      # ключем, тож неперевірений код не отримає справжнього підпису).
      # Пароль і файл ключа існують лише всередині цього кроку.
      - name: Зібрати APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.APIARY_KEYSTORE_B64 || '' }}
          KEYSTORE_PASSWORD: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.APIARY_KEYSTORE_PASSWORD || '' }}
          # адреса форми зворотного зв'язку (Formspree); без неї відгуки не надсилаються
          FEEDBACK_URL: ${{ secrets.APIARY_FEEDBACK_URL }}
          # вхід через Google (див. README, «Вхід через Google»)
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.APIARY_GOOGLE_SERVER_CLIENT_ID }}
          # сервер синхронізації (supabase/README.md); без них - вимкнена.
          # Реліз із main - робочий проєкт, усе інше (тестові збірки гілок) -
          # тестовий, щоб випробування не чіпали справжніх даних. Вибір - у
          # скрипті нижче: реліз без робочих секретів НЕ бере тестові
          IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          SUPABASE_URL_PROD: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY_PROD: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
          SUPABASE_URL_TEST: ${{ secrets.SUPABASE_URL_TEST }}
          SUPABASE_ANON_KEY_TEST: ${{ secrets.SUPABASE_ANON_KEY_TEST }}
          # помічник «Пасічник» (supabase/functions/assistant/README.md): адреса
          # посередника й тестовий код доступу. Лише тестові збірки: у реліз
          # тестовий код не потрапляє (там - demo, доки не буде входу й лімітів)
          ASSISTANT_URL_TEST: ${{ secrets.APIARY_ASSISTANT_URL }}
          ASSISTANT_TOKEN_TEST: ${{ secrets.APIARY_ASSISTANT_TEST_TOKEN }}
        run: |
          set -o pipefail
          if [ "$IS_RELEASE" = "true" ]; then
            SUPABASE_URL="$SUPABASE_URL_PROD"; SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY_PROD"
          else
            SUPABASE_URL="$SUPABASE_URL_TEST"; SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY_TEST"
            ASSISTANT_URL="$ASSISTANT_URL_TEST"; ASSISTANT_TOKEN="$ASSISTANT_TOKEN_TEST"
          fi
          if [ -z "${ASSISTANT_URL:-}" ] || [ -z "${ASSISTANT_TOKEN:-}" ]; then
            ASSISTANT_URL=""; ASSISTANT_TOKEN=""
            echo "::notice::Помічник у цій збірці - demo (немає APIARY_ASSISTANT_URL / APIARY_ASSISTANT_TEST_TOKEN або це реліз)"
          fi
          unset ASSISTANT_TOKEN_TEST
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Секретів Supabase для цієї збірки немає - синхронізація в APK вимкнена"
          fi
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            key="$RUNNER_TEMP/apiary-release.p12"
            trap 'rm -f "$key"' EXIT
            echo "$KEYSTORE_B64" | base64 -d > "$key"
            export APIARY_KEYSTORE_PATH="$key" APIARY_KEY_ALIAS=apiary
            export APIARY_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" APIARY_KEY_PASSWORD="$KEYSTORE_PASSWORD"
            echo "EXPECTED_CERT=release" >> "$GITHUB_ENV"
          else
            # тимчасово (поки секрети не додано) — явний підпис ключем із
            # репозиторію. Раніше він лише копіювався в ~/.android, але збірка
            # його не бачила й щоразу брала ВИПАДКОВИЙ ключ — через це APK не
            # встановлювався поверх попереднього.
            echo "::warning title=ПІДПИС::APK підписано тимчасовим ключем із репозиторію (секретів немає або це не push у main)"
            export APIARY_KEYSTORE_PATH="$GITHUB_WORKSPACE/tool/debug.keystore" APIARY_KEY_ALIAS=androiddebugkey
            export APIARY_KEYSTORE_PASSWORD=android APIARY_KEY_PASSWORD=android
            echo "EXPECTED_CERT=legacy" >> "$GITHUB_ENV"
          fi
          unset KEYSTORE_B64 KEYSTORE_PASSWORD
          flutter build apk --release --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/symbols --dart-define=APIARY_FEEDBACK_URL="$FEEDBACK_URL" --dart-define=APIARY_GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" --dart-define=APIARY_ASSISTANT_URL="$ASSISTANT_URL" --dart-define=APIARY_ASSISTANT_TEST_TOKEN="$ASSISTANT_TOKEN" 2>&1 | tee build.log
      - name: Показати помилку збірки
        if: failure()
        shell: bash
        run: python3 tool/ci_error_report.py build.log
      # APK з неочікуваним підписом не публікується
      - name: Перевірити підпис APK
        shell: bash
        run: |
          set -eo pipefail
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          expected=$(awk -v k="$EXPECTED_CERT" '$1==k {print $2}' tool/signing-cert.sha256)
          if [ -z "$expected" ]; then
            echo "::error title=ПІДПИС::невідомий очікуваний ключ «$EXPECTED_CERT»"; exit 1
          fi
          for f in build/app/outputs/flutter-apk/*.apk; do
            out=$("$signer" verify --print-certs "$f" 2>&1) || { echo "::error title=ПІДПИС::apksigner: $(echo "$out" | head -5 | tr '\n' ' ')"; exit 1; }
            # сертифікати підписувачів (без "Source Stamp", якщо він є)
            got=$(echo "$out" | grep 'certificate SHA-256 digest' | grep -v -i 'stamp' | awk '{print $NF}' | sort -u || true)
            echo "$f: $got"
            if [ -z "$got" ] || [ "$(echo "$got" | wc -l)" != 1 ] || [ "$got" != "$expected" ]; then
              echo "::error title=ПІДПИС-ВИВІД::$(echo "$out" | grep -i 'sha-256\|signer' | head -8 | tr '\n' ' ')"
              echo "::error title=ПІДПИС::$f підписано не тим ключем ($got, очікувався $EXPECTED_CERT)"
              exit 1
            fi
          done
          echo "::notice title=ПІДПИС::APK підписано ключем «$EXPECTED_CERT»"
      # Запобіжник «Програму не встановлено»: новий APK має ставитись ПОВЕРХ
      # опублікованого (той самий ключ підпису і не менший versionCode) —
      # інакше в людей оновлення не встановиться, а видалення стирає дані.
      - name: Чи встановиться поверх попередньої версії
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          bt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          new=build/app/outputs/flutter-apk/app-release.apk
          prev=""
          for name in apiary.apk apiary-arm64.apk; do
            if gh release download latest -p "$name" -O prev.apk 2>/dev/null; then prev=prev.apk; break; fi
          done
          if [ -z "$prev" ]; then echo "::notice title=ОНОВЛЕННЯ::попереднього APK немає — пропускаю"; exit 0; fi
          cert() { "$bt/apksigner" verify --print-certs "$1" | grep 'certificate SHA-256 digest' | grep -vi stamp | awk '{print $NF}' | sort -u; }
          code() { "$bt/aapt2" dump badging "$1" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -1; }
          if [ "$(cert "$new")" != "$(cert "$prev")" ]; then
            echo "::error title=ОНОВЛЕННЯ::інший ключ підпису, ніж в опублікованій версії — у людей буде «Програму не встановлено»"; exit 1
          fi
          if [ "$(code "$new")" -lt "$(code "$prev")" ]; then
            echo "::error title=ОНОВЛЕННЯ::versionCode $(code "$new") менший за опублікований $(code "$prev") — підніміть номер після «+» у pubspec.yaml"; exit 1
          fi
          echo "::notice title=ОНОВЛЕННЯ::ставиться поверх опублікованої версії (versionCode $(code "$prev") → $(code "$new"))"
      - name: Розмір APK (звіт)
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, glob, os
          out = []
          for f in sorted(glob.glob('build/app/outputs/flutter-apk/*.apk')):
              out.append(f'{os.path.basename(f)} = {os.path.getsize(f)}')
          z = zipfile.ZipFile('build/app/outputs/flutter-apk/app-release.apk')
          items = sorted(z.infolist(), key=lambda i: -i.compress_size)[:14]
          out.append('top entries (compressed):')
          for i in items:
              out.append(f'  {i.compress_size:>9} {i.filename}')
          print('::notice title=APKSIZE::' + '%0A'.join(out))
          PY
      # тестова збірка гілки - одразу в пре-реліз test-<гілка> (не чекаючи
      # артефактів: їхня квота сховища буває вичерпана)
      - name: Тестовий APK гілки
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: test-${{ github.ref_name }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk apiary.apk
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" apiary.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "Тестова збірка гілки ${{ github.ref_name }}" \
            --notes "Збірка з коміту ${GITHUB_SHA::7} гілки ${{ github.ref_name }} (не основна)."
      # Після кожного push у main — оновлює реліз "latest" з готовими файлами,
      # щоб їх можна було скачати за прямим посиланням (і з телефона).
      # Публікується прямо з цієї збірки (без артефактів: їхня квота сховища
      # буває вичерпана, і тоді реліз не оновлювався).
      - name: Підготувати файли релізу
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 tool/whats_new.py --md > notes.md && cat notes.md
          cp build/app/outputs/flutter-apk/app-release.apk apiary.apk
          sha256sum apiary.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la apiary.apk
      - name: Оновити реліз latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest apiary.apk SHA256SUMS.txt \
            --target "${{ github.sha }}" \
            --title "Моя пасіка — остання збірка" \
            --notes "$(cat notes.md)

          Автоматична збірка з коміту ${GITHUB_SHA::7}.
          - apiary.apk — для будь-якого Android-телефона (Android 7 і новіші)
          - SHA256SUMS.txt — контрольні суми файлів"
      # окремий постійний реліз для кожної версії з pubspec (v0.3.5 тощо):
      # створюється один раз, коли версія вперше потрапила в main
      - name: Реліз версії
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/')
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V уже є — пропускаю"
          else
            gh release create "v$V" apiary.apk SHA256SUMS.txt \
              --target "${{ github.sha }}" \
              --title "Vulyk $V" \
              --notes-file notes.md
          fi
