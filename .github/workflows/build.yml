name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    name: Перевірка й тести
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: SQLite для тестів
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter --version
      - run: flutter pub get
      # падає лише на помилках (попередження й підказки — не критичні)
      - name: Аналіз коду
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee build.log
      - name: Тести
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee build.log
      - name: Показати помилку
        if: failure()
        run: python3 tool/ci_error_report.py build.log
      - name: Бенчмарк швидкості
        shell: bash
        run: |
          flutter test test_bench/bench_test.dart 2>&1 | tee bench.log || true
          grep -h '^BENCH|' bench.log | sed 's/^BENCH|//' > bench.txt || true
          echo "::notice title=BENCH::$(sed ':a;N;$!ba;s/\n/%0A/g' bench.txt)"

  android:
    name: APK для Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Згенерувати платформні файли
        run: |
          flutter create --platforms=android --org org.apiary --project-name apiary .
          dart run tool/patch_platforms.dart
      # sqlite3_flutter_libs потрібен лише на комп'ютері: на Android
      # sqflite користується системною SQLite, а власна копія додає
      # ~1,7 МБ на кожну архітектуру.
      - name: Прибрати зайву нативну SQLite з Android-збірки
        run: flutter pub remove sqlite3_flutter_libs
      - name: Постійний ключ підпису (щоб оновлення встановлювались поверх старих)
        run: |
          mkdir -p ~/.android
          cp tool/debug.keystore ~/.android/debug.keystore
      - name: Зібрати APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols 2>&1 | tee build.log
      - name: Показати помилку збірки
        if: failure()
        shell: bash
        run: python3 tool/ci_error_report.py build.log
      - name: Розмір APK (звіт)
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, glob, os
          out = []
          for f in sorted(glob.glob('build/app/outputs/flutter-apk/*.apk')):
              out.append(f'{os.path.basename(f)} = {os.path.getsize(f)}')
          z = zipfile.ZipFile('build/app/outputs/flutter-apk/app-arm64-v8a-release.apk')
          items = sorted(z.infolist(), key=lambda i: -i.compress_size)[:14]
          out.append('arm64 top entries (compressed):')
          for i in items:
              out.append(f'  {i.compress_size:>9} {i.filename}')
          print('::notice title=APKSIZE::' + '%0A'.join(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: apiary-apk
          path: build/app/outputs/flutter-apk/*.apk

  windows:
    name: Програма для Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Згенерувати платформні файли
        run: |
          flutter create --platforms=windows --org org.apiary --project-name apiary .
          dart run tool/patch_platforms.dart
      - name: Зібрати для Windows
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release --obfuscate --split-debug-info=build/symbols 2>&1 | tee build.log
      - name: Показати помилку збірки
        if: failure()
        shell: bash
        run: python tool/ci_error_report.py build.log
      - name: Розмір Windows-збірки (звіт)
        shell: bash
        run: |
          python - <<'PY'
          import os
          rows = []
          root = 'build/windows/x64/runner/Release'
          for d, _, fs in os.walk(root):
              for f in fs:
                  q = os.path.join(d, f)
                  rows.append((os.path.getsize(q), os.path.relpath(q, root)))
          rows.sort(reverse=True)
          out = [f'total = {sum(r[0] for r in rows)}'] + [f'  {a:>10} {b}' for a, b in rows[:12]]
          print('::notice title=WINSIZE::' + '%0A'.join(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: apiary-windows
          path: build/windows/x64/runner/Release/

  # Після кожного push у main — оновлює реліз "latest" з готовими файлами,
  # щоб їх можна було скачати за прямим посиланням (і з телефона).
  release:
    name: Опублікувати реліз
    needs: [android, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Підготувати файли
        run: |
          mv dist/apiary-apk/app-arm64-v8a-release.apk apiary-arm64.apk
          mv dist/apiary-apk/app-armeabi-v7a-release.apk apiary-arm32.apk
          mv dist/apiary-apk/app-x86_64-release.apk apiary-x86_64.apk
          (cd dist/apiary-windows && zip -qr9 ../../apiary-windows.zip .)
          ls -la apiary-arm64.apk apiary-arm32.apk apiary-x86_64.apk apiary-windows.zip
      - name: Оновити реліз latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest apiary-arm64.apk apiary-arm32.apk apiary-x86_64.apk apiary-windows.zip \
            --target "${{ github.sha }}" \
            --title "Моя пасіка — остання збірка" \
            --notes "Автоматична збірка з коміту ${GITHUB_SHA::7}.
          - apiary-arm64.apk — для більшості сучасних Android-телефонів
          - apiary-arm32.apk — для старих/бюджетних Android-телефонів
          - apiary-x86_64.apk — для Android на процесорі x86 (рідко)
          - apiary-windows.zip — розпакувати й запустити apiary.exe"
