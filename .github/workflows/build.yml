name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    name: Перевірка й тести
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: SQLite для тестів
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter --version
      - run: flutter pub get
      # падає лише на помилках (попередження й підказки — не критичні)
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  android:
    name: APK для Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Згенерувати платформні файли
        run: |
          flutter create --platforms=android --org org.apiary --project-name apiary .
          dart run tool/patch_platforms.dart
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apiary-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Програма для Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Згенерувати платформні файли
        run: |
          flutter create --platforms=windows --org org.apiary --project-name apiary .
          dart run tool/patch_platforms.dart
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: apiary-windows
          path: build/windows/x64/runner/Release/
