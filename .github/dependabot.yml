# Пропозиції оновлень (зокрема з виправленнями безпеки) для пакетів Dart
# і дій GitHub — приходять як pull request'и, самі нічого не змінюють.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
